apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-exchange-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /opt/k8s-storage
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-exchange-pvc
spec:
  storageClassName: ""
  volumeName: data-exchange-pv
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-pvc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-pvc
  template:
    metadata:
      labels:
        app: data-exchange-pvc
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                date >> /shared/data.txt
                sleep 5
              done
          volumeMounts:
            - name: persistent-storage
              mountPath: /shared

        - name: multitool
          image: wbitt/network-multitool
          volumeMounts:
            - name: persistent-storage
              mountPath: /shared

      volumes:
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: data-exchange-pvc
